name: Build macOS ARM (DMG only)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-arm:
    # macos-14 runners are Apple Silicon; nothing else builds here.
    runs-on: macos-14
    permissions:
      contents: write # needed to create the auto release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust (ARM only)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + frontend build
        run: npm run build

      - name: Build Tauri DMG (aarch64 only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles dmg --target aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: runningbord-macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Auto release DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-arm-build-${{ github.run_number }}
          name: macOS ARM build ${{ github.run_number }}
          body: Automated macOS Apple Silicon DMG from main (${{ github.sha }}).
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
